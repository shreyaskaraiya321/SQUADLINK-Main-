<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Squadlink</title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="SL.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
                
    <!-- Minimal Nav -->
    <header class="navbar">
        <div class="nav-container" style="justify-content: center; padding-top: 20px;">
            <a href="SL.html" class="logo" style="text-decoration: none; display: flex; align-items: center;">
                <img src="squadlink_logo.png" alt="Squadlink" style="height: 45px; width: auto; object-fit: contain;">
            </a>
        </div>
    </header>

    <!-- Background -->
    <div class="hero-bg" style="position: fixed;">
        <div class="grid-container">
            <div class="animated-grid"></div>
        </div>
        </div>

    <!-- Login Container -->
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h2>Access Granted</h2>
                <p>Enter your credentials to continue</p>
                <div id="formMessage" style="color: var(--color-error); font-size: 0.9rem; margin-top: 10px; display: none; text-shadow: 0 0 5px rgba(255, 180, 171, 0.5);"></div>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="input-group" id="usernameGroup" style="display: none;">
                    <input type="text" id="username" placeholder=" ">
                    <label for="username">Username</label>
                    <div class="input-glow"></div>
                </div>
                
                <div class="input-group">
                    <input type="email" id="email" required placeholder=" ">
                    <label for="email">Email Address</label>
                    <div class="input-glow"></div>
                </div>
                
                <div class="input-group">
                    <input type="password" id="password" required placeholder=" ">
                    <label for="password">Password</label>
                    <div class="input-glow"></div>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Remember Me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="cta-btn primary-btn login-btn">
                    <span>Initialize Link -></span>
                </button>
            </form>

            <div class="social-login">
                <p>Or connect with</p>
                <div class="social-buttons">
                    <button class="social-btn discord">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                            <path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                        </svg>
                    </button>
                    <button class="social-btn google">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                            <path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/>
                        </svg>
                    </button>
                    <button class="social-btn twitch">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                            <path d="M4.265 3L3 6.236v13.223h5.504V23h3.317l2.146-2.146h4.385l3.805-3.806V3H4.265zm15.776 13.064l-2.616 2.615h-4.83l-2.147 2.147v-2.147H7.135V4.659h12.906v11.405zm-8.232-6.52v4.887H9.98V9.544h1.83zm3.935 0v4.887h-1.83V9.544h1.83z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="toggle-form">
                <p>No squad yet? <a href="#" id="registerLink">Create Account</a></p>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
