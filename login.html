<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Squadlink</title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="SL.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="auth-page">
    <!-- Restrained Ambient Backdrop -->
    <div class="auth-backdrop" aria-hidden="true"></div>

    <!-- Compact Brand Header -->
    <header class="auth-header">
        <div class="auth-header-inner">
            <a href="SL.html" class="auth-brand" aria-label="Squadlink Home">
                <img src="squadlink_logo.png" alt="Squadlink" class="auth-logo">
            </a>
            <a href="SL.html" class="auth-back-link">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>Back to Home</span>
            </a>
        </div>
    </header>

    <!-- Centered Authentication Workspace -->
    <main class="auth-main">
        <section class="auth-card" aria-labelledby="authHeading">
            <!-- Mode Switcher -->
            <div class="auth-tabs" id="authTabs" role="tablist" aria-label="Authentication mode">
                <button type="button" class="auth-tab active" id="tabLogin" data-mode="login" role="tab" aria-selected="true">
                    Sign In
                </button>
                <button type="button" class="auth-tab" id="tabRegister" data-mode="register" role="tab" aria-selected="false">
                    Create Account
                </button>
            </div>

            <!-- Card Heading & Supporting Copy -->
            <div class="auth-card-header">
                <h1 id="authHeading" class="auth-title">Welcome Back</h1>
                <p id="authSubtitle" class="auth-subtitle">Sign in to your Squadlink account and get back in the game.</p>
            </div>

            <!-- Form-Level Feedback -->
            <div id="formMessage" class="auth-alert" role="status" aria-live="polite" hidden></div>

            <!-- Authentication Form -->
            <form id="loginForm" class="auth-form" novalidate>
                <div class="auth-field" id="usernameGroup" hidden>
                    <label for="username" class="auth-label">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="auth-input"
                        placeholder="Choose a username"
                        autocomplete="username"
                    >
                    <span class="field-error" id="usernameError" aria-live="polite"></span>
                </div>

                <div class="auth-field" id="emailGroup">
                    <label for="email" class="auth-label">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="auth-input"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                    <span class="field-error" id="emailError" aria-live="polite"></span>
                </div>

                <div class="auth-field" id="passwordGroup">
                    <label for="password" class="auth-label" id="passwordLabel">Password</label>
                    <div class="password-field">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="auth-input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            id="passwordToggle"
                            class="password-toggle"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <span class="field-hint" id="passwordHint" hidden>Minimum 6 characters</span>
                    <span class="field-error" id="passwordError" aria-live="polite"></span>
                </div>

                <div class="auth-options" id="formOptions">
                    <label class="checkbox-container" for="rememberMe">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span class="checkmark" aria-hidden="true"></span>
                        <span>Remember me</span>
                    </label>
                    <a href="#" id="forgotPasswordLink" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" id="submitBtn" class="auth-submit-btn">
                    <span id="submitBtnText">Sign In</span>
                </button>
            </form>

            <!-- State Footer -->
            <div class="auth-card-footer" id="authFooter">
                <p>Don't have an account? <a href="#" id="registerLink">Create Account</a></p>
            </div>
        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>
