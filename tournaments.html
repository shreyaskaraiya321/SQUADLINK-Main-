<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squadlink - Tournaments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="SL.css">
    <link rel="stylesheet" href="tournaments.css">
</head>

<body>
    <!-- Custom Cursor -->
    <div class="custom-cursor"></div>
    <div class="cursor-trail trail-1"></div>
    <div class="cursor-trail trail-2"></div>
    <div class="cursor-trail trail-3"></div>

    <!-- Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <a href="SL.html" class="logo" style="text-decoration: none;">
                <img src="squadlink_logo.png" alt="Squadlink" style="height: 120px; width: auto; object-fit: contain;">
            </a>
            <nav class="nav-links">
                <a href="SL.html#home" class="nav-link">Home</a>
                <a href="tournaments.html" class="nav-link active">Tournaments</a>
                <a href="teams.html" class="nav-link">Teams</a>
                <a href="SL.html#about" class="nav-link">About</a>
            </nav>
            <button class="cta-btn join-btn" onclick="window.location.href='login.html'">Join Now</button>
            <button class="mobile-menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="tournaments-page">
        <!-- Floating Particles Background -->
        <div class="particles"></div>
        <div class="glow-orb orb-1" style="top: -10%; left: -10%;"></div>
        <div class="glow-orb orb-2" style="top: 40%; right: -10%;"></div>

        <div class="container tourney-container">
            <!-- Header Section -->
            <section class="tourney-header" data-aos="fade-up">
                <h1 class="page-title">Tournaments</h1>
                <p class="page-subtitle">Compete. Win. Dominate.</p>
            </section>

            <!-- Filter & Search Bar -->
            <section class="filter-bar" data-aos="fade-up" data-delay="100">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search tournaments...">
                </div>
                <div class="filters-wrapper">
                    <div class="custom-select">
                        <select id="game-filter">
                            <option value="all">🎮 All Games</option>
                            <option value="BGMI">BGMI</option>
                            <option value="Free Fire">Free Fire</option>
                            <option value="Call of Duty Mobile">Call of Duty Mobile</option>
                            <option value="Valorant">Valorant</option>
                        </select>
                    </div>
                    <div class="custom-select">
                        <select id="status-filter">
                            <option value="all">⚡ All Status</option>
                            <option value="live">Live</option>
                            <option value="upcoming">Upcoming</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                    <div class="custom-select">
                        <select id="entry-filter">
                            <option value="all">🎟️ Entry Type</option>
                            <option value="free">Free</option>
                            <option value="paid">Paid</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- Tabs -->
            <section class="tourney-tabs" data-aos="fade-up" data-delay="200">
                <button class="tab-btn active" data-tab="all">All</button>
                <button class="tab-btn" data-tab="live">
                    Live <span class="live-dot"></span>
                </button>
                <button class="tab-btn" data-tab="upcoming">Upcoming 🟡</button>
                <button class="tab-btn" data-tab="completed">Completed ⚫</button>
            </section>

            <!-- Featured Tournament -->
            <section class="featured-tourney" id="featured-container" data-aos="fade-up" data-delay="300">
                <!-- Rendered via JS -->
            </section>

            <!-- Tournament Grid -->
            <section class="tourney-grid" id="tourney-grid" data-aos="fade-up" data-delay="400">
                <!-- Rendered via JS -->
            </section>

            <!-- My Tournament History -->
            <section id="history-section" class="history-section" data-aos="fade-up" data-delay="500">
                <!-- Rendered via JS -->
            </section>
        </div>
    </main>

    <!-- ===== TOURNAMENT DETAILS MODAL ===== -->
    <div class="modal-overlay" id="tourney-modal">
        <div class="modal-glass">
            <button class="modal-close-btn" onclick="closeModal()">✕</button>
            <div class="modal-body" id="modal-body">
                <!-- Rendered via JS -->
            </div>
        </div>
    </div>

    <!-- ===== BRACKET PREVIEW MODAL ===== -->
    <div class="modal-overlay" id="bracket-modal">
        <div class="modal-glass modal-glass-bracket">
            <button class="modal-close-btn" onclick="closeBracket()">✕</button>
            <div class="modal-body" id="bracket-modal-body">
                <!-- Rendered via JS -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <a href="#" class="footer-logo">
                    <img src="squadlink_logo.png" alt="Squadlink"
                        style="height: 60px; width: auto; object-fit: contain;">
                </a>
                <p class="copyright">© 2025 Squadlink. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="tournaments.js"></script>
</body>

</html>
