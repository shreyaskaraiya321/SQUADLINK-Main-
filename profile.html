<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Squadlink</title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="SL.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
                
    <!-- Minimal Nav -->
    <header class="navbar">
        <div class="nav-container" style="justify-content: space-between; padding-top: 20px;">
            <a href="SL.html" class="logo" style="text-decoration: none; display: flex; align-items: center;">
                <img src="squadlink_logo.png" alt="Squadlink" style="height: 45px; width: auto; object-fit: contain;">
            </a>
            <div class="nav-actions" style="display:flex; align-items:center; gap: 15px;">
                <button class="cta-btn secondary-btn" onclick="window.location.href='SL.html'">Back to Home</button>
            </div>
        </div>
    </header>

    <!-- Background -->
    <div class="hero-bg" style="position: fixed;">
        <div class="grid-container">
            </div>
        </div>

    <!-- Profile Container -->
    <div class="login-wrapper">
        <div class="login-container profile-container">
            <div class="login-header">
                <h2>Operative Profile</h2>
                <p>Update your credentials and identity</p>
                <div id="formMessage" style="font-size: 0.9rem; margin-top: 10px; display: none;"></div>
            </div>
            
            <form id="profileForm" class="login-form">
                
                <div class="avatar-upload">
                    <div class="avatar-preview">
                        <img id="avatarImage" src="https://via.placeholder.com/150/1a1a2e/00FFFF?text=Avatar" alt="Profile Picture">
                        <div class="avatar-overlay">
                            <span>Change</span>
                        </div>
                    </div>
                    <input type="file" id="photoUpload" accept="image/*" style="display: none;">
                </div>

                <div class="user-stats-row" style="display:flex;justify-content:center;gap:20px;margin-bottom:20px;color:var(--color-primary);">
                    <div style="text-align:center;">
                        <div style="font-size:1.5rem;font-weight:bold" id="prof-level">1</div>
                        <div style="font-size:0.8rem;opacity:0.8;text-transform:uppercase;letter-spacing:1px">Level</div>
                    </div>
                    <div style="text-align:center;">
                        <div style="font-size:1.5rem;font-weight:bold" id="prof-xp">0</div>
                        <div style="font-size:0.8rem;opacity:0.8;text-transform:uppercase;letter-spacing:1px">XP</div>
                    </div>
                    <div style="text-align:center;">
                        <div style="font-size:1.5rem;font-weight:bold" id="prof-streak">0</div>
                        <div style="font-size:0.8rem;opacity:0.8;text-transform:uppercase;letter-spacing:1px">Streak <svg class="filter-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 2.4 5.6a6.5 6.5 0 11-9.9-10.6c-1.334 1.334-1.9 2.56-1.5 4.5.3 1.444.667 2.333 1.5 3.5z"></path></svg></div>
                    </div>
                </div>

                <div class="input-group">
                    <input type="text" id="username" required placeholder=" ">
                    <label for="username">Username</label>
                    <div class="input-glow"></div>
                </div>
                
                <div class="input-group">
                    <input type="email" id="email" required placeholder=" " disabled>
                    <label for="email">Email Address</label>
                    <div class="input-glow"></div>
                </div>
                
                <div class="input-group" style="opacity: 0.6; pointer-events: none;">
                    <input type="password" id="password" value="********" readonly placeholder=" ">
                    <label for="password">Password (Currently Immutable)</label>
                    <div class="input-glow"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="cta-btn primary-btn login-btn">
                        <span>Save Profile -></span>
                    </button>
                    <button type="button" id="logoutBtn" class="cta-btn danger-btn login-btn" style="margin-top: 15px; background: rgba(255, 180, 171, 0.1); border-color: var(--color-error); color: var(--color-error);">
                        <span>Disconnect Link</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="profile.js"></script>
</body>
</html>
